# Contributors to the RDM Maturity Model.
#
# Pooled across the whole model rather than recorded per indicator: the model is
# revised as a whole, and the indicator pages in the DS Handbook are generated from
# maturity_model.json, so they have no frontmatter of their own to carry an
# attribution.
#
# Maintained by hand. To add someone, add their name and whatever of the fields
# below are known: git, orcid, affiliation, email. A name on its own is fine -- it
# renders without an avatar or links.
#
# Migrated on 2026-09-15 from the contributors named in the frontmatter of the 25
# hand-written indicator pages in the DS Handbook, with their details copied from
# that repository's _data/CONTRIBUTORS.yaml. These spellings were merged as one
# person: Aida Moure Fernandez and Aída Moure-Fernández -> Aída Moure Fernández;
# Hana Marcetic and Hana Marčeti -> Hana Marčetić; Aina Jené -> Aina Jene;
# Nils Lubke -> Nils-Christian Lübke.
#
# The DS Handbook renders this list on its maturity model page, and falls back to
# its own _data/CONTRIBUTORS.yaml for anyone whose details are missing here.

