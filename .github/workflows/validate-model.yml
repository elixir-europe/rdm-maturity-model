name: Validate model

on:
  # No path filter on pull requests: this check is required for merging into
  # main, and a required check that never runs leaves the pull request blocked.
  pull_request:
  push:
    branches: [ main ]
    paths:
      - '_data/maturity_model.json'
      - '_data/maturity_model.schema.json'
      - 'scripts/validate_model.py'
      - '.github/workflows/validate-model.yml'
  workflow_dispatch:
  # release.yml runs this check before it publishes a release.
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install check-jsonschema

      # Shape of the file: types, required keys, id patterns, string hygiene.
      - name: Check the model against the schema
        run: |
          check-jsonschema \
            --schemafile _data/maturity_model.schema.json \
            _data/maturity_model.json

      # Rules that compare one field with another, which a schema cannot express.
      - name: Check the model for internal consistency
        run: python scripts/validate_model.py
